[package]
name = "swiftfetch-desktop"
description = "SwiftFetch desktop app shell (Tauri v2)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
swiftfetch-engine = { workspace = true }
swiftfetch-media = { workspace = true }
swiftfetch-net = { workspace = true }
swiftfetch-sites-youtube = { workspace = true }
swiftfetch-scheduler = { workspace = true }
tauri-plugin-clipboard-manager = "2"
tokio-util = { workspace = true }
chrono = { workspace = true }
swiftfetch-store = { workspace = true }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-notification = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
swiftfetch-test-server = { workspace = true }
tempfile = { workspace = true }
