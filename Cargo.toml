[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/cli",
    "crates/common",
    "crates/engine",
    "crates/grabber",
    "crates/media",
    "crates/native-host",
    "crates/net",
    "crates/scheduler",
    "crates/store",
    "crates/torrent",
]

[workspace.package]
authors = ["Sachin Kumar"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
dirs = "7"
refinery = { version = "0.10", features = ["rusqlite"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
swiftfetch-common = { path = "crates/common" }
swiftfetch-store = { path = "crates/store" }
tauri = "2"
tauri-build = "2"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = "symbols"
