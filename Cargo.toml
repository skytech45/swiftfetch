[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/cli",
    "crates/common",
    "crates/engine",
    "crates/grabber",
    "crates/media",
    "crates/native-host",
    "crates/net",
    "crates/scheduler",
    "crates/sites/youtube",
    "crates/store",
    "crates/torrent",
    "scripts/test-server",
]

[workspace.package]
authors = ["Sachin Kumar"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7"
futures-util = "0.3"
md-5 = "0.10"
refinery = { version = "0.10", features = ["rusqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swiftfetch-common = { path = "crates/common" }
swiftfetch-engine = { path = "crates/engine" }
swiftfetch-scheduler = { path = "crates/scheduler" }
swiftfetch-media = { path = "crates/media" }
swiftfetch-net = { path = "crates/net" }
swiftfetch-sites-youtube = { path = "crates/sites/youtube" }
swiftfetch-store = { path = "crates/store" }
swiftfetch-test-server = { path = "scripts/test-server" }
tauri = "2"
tauri-build = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "symbols"
